<html>
  <head>
    <title>Bookmarks</title>
    <link rel = "stylesheet" href = "style.css" />
    <script>
        let DataVersion = "1.0";
    </script>
    <script src = "post.js"></script>
    <script src = "generate.js"></script>
    <script src = "version.js"></script>
  </head>
  <body>
    <div id = "menuHeader" style = "height: 80px;">
      <img class = "icon" src = "https://cdn.iconscout.com/icon/free/png-512/settings-410-461751.png"
          onclick = "menuClick('settings');" />
      <span id = "menuOptions" hidden>
        <svg class = "icon" onclick = "menuClick('add');">
          <path id = "add-icon"
            d = "M 37.5 0
            Q 75 0 75 37.5
            Q 75 75 37.5 75
            Q 0 75 0 37.5
            Q 0 0 37.5 0
            Z" fill = "var(--menu-bg-color)" />
          <rect x = "10" y = "31" width = "55" height = "13" rx = "2" ry = "2" fill = "var(--menu-primary-color)" />
          <rect x = "31" y = "10" width = "13" height = "55" rx = "2" ry = "2" fill = "var(--menu-primary-color)" />
        </svg>
        <svg class = "icon" onclick = "menuClick('remove');">
          <path id = "remove-icon"
            d = "M 37.5 0
            Q 75 0 75 37.5
            Q 75 75 37.5 75
            Q 0 75 0 37.5
            Q 0 0 37.5 0
            Z" fill = "var(--menu-bg-color)" />
          <rect x = "10" y = "31" width = "55" height = "13" rx = "2" ry = "2" fill = "var(--menu-primary-color)" />
        </svg>
        <svg class = "icon" onclick = "menuClick('edit');">
          <path id = "edit-icon"
            d = "M 37.5 0
            Q 75 0 75 37.5
            Q 75 75 37.5 75
            Q 0 75 0 37.5
            Q 0 0 37.5 0
            Z" fill = "var(--menu-bg-color)" />
          <path d = "M 0 0
            L 12 5
            L 50 5
            L 50 -5
            L 12 -5
            L 0 0 Z"
            stroke = "var(--menu-primary-color)"
            stroke-width = "4"
            stroke-linejoin = "round"
            fill = "var(--menu-secondary-color, none)"
            transform = "translate(17, 58) scale(1.1) rotate(-45)" />
        </svg>
        <svg class = "icon" onclick = "menuClick('move');">
          <path id = "move-icon"
            d = "M 37.5 0
            Q 75 0 75 37.5
            Q 75 75 37.5 75
            Q 0 75 0 37.5
            Q 0 0 37.5 0
            Z" fill = "var(--menu-bg-color)" />

          <path d = "M 10 27
            L 27 16
            L 27 22
              L 63 22
                Q 65 22 65 24
                Q 65 32 65 30
              L 63 32
            L 27 32
            L 27 38
            Z" fill = "var(--menu-primary-color)" />

          <path d = "M 65 48
            L 48 37
            L 48 43
              L 12 43
                Q 10 43 10 45
                Q 10 53 10 51
              L 12 53
            L 48 53
            L 48 59
            Z" fill = "var(--menu-primary-color)" />
        </svg>
        <svg class = "icon" onclick = "menuClick('square');">
          <path id = "square-icon"
            d = "M 37.5 0
            Q 75 0 75 37.5
            Q 75 75 37.5 75
            Q 0 75 0 37.5
            Q 0 0 37.5 0
            Z" fill = "var(--menu-bg-color)" />
          <rect x = "13" y = "13" width = "22" height = "22" rx = "2" ry = "2" fill = "var(--menu-primary-color)" />
          <rect x = "40" y = "13" width = "22" height = "22" rx = "2" ry = "2" fill = "var(--menu-primary-color)" />
          <rect x = "13" y = "40" width = "22" height = "22" rx = "2" ry = "2" fill = "var(--menu-primary-color)" />
          <rect x = "40" y = "40" width = "22" height = "22" rx = "2" ry = "2" fill = "var(--menu-primary-color)" />
        </svg>
      </span>
    </div>

    <div id = "infoForm"
        class = "centeredOuter">
      <div class = "centeredInner">
        <label for = "url">Site URL:</label>
        <input type = "url" id = "url" name = "url" /><br><br>
        <label for = "iconType">Icon Type:</label>
        <select name = "iconType" id = "iconType">
          <option value = "">-- Pick One --</option>
          <option value = "text">Text</option>
          <option value = "image">Image</option>
        </select><br><br>
        <div id = "iconText" hidden>
          <label for = "iconText">Icon Text:</label>
          <input type = "text" name = "iconText" /><br><br>
        </div>
        <div id = "iconImage" hidden>
          <label for = "iconImage">Icon URL:</label>
          <input type = "url" name = "iconImage" /><br><br>
        </div>
        <div style = "text-align: center;">
          <input type = "button"
              id = "infoSubmit"
              value = "Create"
              onclick = "submitInfo();" />
        </div>
      </div>
    </div>

    <script src = "getElements.js"></script>
    <script src = "dynamic.js"></script>
  </body>
</html>
